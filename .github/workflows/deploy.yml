name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - name: Build for GitHub Pages
        run: npm run build
        env:
          # Pages serves project sites from /<repository>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Public values only (repository *variables*): the project URL and the anon/publishable key.
          # Accounts stay off until the VITE_ENABLE_ACCOUNTS variable is set to "true" (docs/OPERATIONS.md §4).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_ACCOUNTS: ${{ vars.VITE_ENABLE_ACCOUNTS }}
      - name: No privileged keys in the bundle
        run: npm run check:dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Prove the real deployment works: load it from GitHub Pages, check the service
  # worker scope and manifest under the repository path, complete onboarding and
  # reload offline.
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for the Pages CDN to serve the new build
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$PAGE_URL" | grep -q "<title>Ascend</title>"; then echo "Live: $PAGE_URL"; exit 0; fi
            sleep 10
          done
          echo "Site did not come up at $PAGE_URL" >&2; exit 1
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the live site
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.page_url }}
