name: Nightly encrypted backup

# Free Supabase projects have no automatic backups (COST §5): this dumps the database every night,
# encrypts it with age to the owner's PUBLIC key, and keeps it as a private workflow artifact for 90 days.
# Only the owner's private key can decrypt it; it never touches the repository.
# Restore steps and the drill: docs/OPERATIONS.md §5 (scripts/backup-drill.sh).
on:
  schedule:
    - cron: '17 21 * * *' # 02:47 IST — off-peak
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ] || [ -z "$RECIPIENT" ]; then
            echo "::notice::Backups are not configured yet (docs/OPERATIONS.md §3 and §5). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: 2.122.1
      - name: Install age
        if: steps.cfg.outputs.ready == 'true'
        run: sudo apt-get install -y age
      - name: Dump
        if: steps.cfg.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          mkdir -p dump
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --role-only -f dump/roles.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f dump/schema.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy -f dump/data.sql
      - name: Encrypt (plaintext never leaves the runner)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          name="ascend-$(date -u +%Y%m%dT%H%MZ)"
          tar czf "$name.tgz" -C dump .
          age -r "$RECIPIENT" -o "$name.tgz.age" "$name.tgz"
          shred -u "$name.tgz" dump/*.sql
          echo "NAME=$name" >> "$GITHUB_ENV"
          ls -la "$name.tgz.age"
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tgz.age
          retention-days: 90
          if-no-files-found: error
