<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070b" />
    <!-- Pre-paint appearance: applies the saved theme/accent/motion before CSS paints, so reloads never flash.
         Mirrors src/lib/theme.ts (key "ascend.appearance"); the colours are the --bg tokens in src/styles/index.css.
         If a CSP is added, allow this script by its sha256 hash rather than 'unsafe-inline'. -->
    <script>
      (function () {
        var d = document.documentElement, a = {};
        try { a = JSON.parse(localStorage.getItem('ascend.appearance') || '{}') || {}; } catch (e) {}
        var mq = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
        var light = a.theme === 'light' || (a.theme === 'system' && mq('(prefers-color-scheme: light)'));
        d.classList.add(light ? 'light' : 'dark');
        d.dataset.accent = typeof a.accent === 'string' ? a.accent : 'violet';
        d.dataset.motion = a.motion === 'reduce' || (a.motion !== 'full' && mq('(prefers-reduced-motion: reduce)')) ? 'reduce' : 'full';
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f3ee');
      })();
    </script>
    <meta name="description" content="Ascend — a local-first productivity RPG. Turn goals into campaigns, questlines and quests." />
    <title>Ascend</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ascend — a local-first productivity RPG" />
    <meta property="og:description" content="Turn real goals into campaigns, quests and visible progress. Free, offline and private." />
    <meta property="og:url" content="https://its-harsh-here.github.io/ASCEND/" />
    <meta property="og:image" content="https://its-harsh-here.github.io/ASCEND/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
